# ═══════════════════════════════════════════════════════════════════════════════
# NEXMARKET API — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
# STAGES:
#   Stage 1 — Build      restore + build (backend/ solution)
#   Stage 2 — Docker     build & push image to GHCR
#   Stage 3 — Deploy Dev pull image → run on Dev VM (develop branch, port 5010)
#
# The image is SECRET-FREE: appsettings.Development.json is excluded via
# backend/.dockerignore. All secrets are injected into the container at deploy
# time via an --env-file written on the VM from GitHub secrets.
#
# Prereq: run infra-dev.yml at least once first — this workflow deploys the API
# container only, it does not provision Postgres/Redis.
#
# ─────────────────────────────────────────────────────────────────────────────
# SECRETS (repo Settings → Secrets and variables → Actions)
# ─────────────────────────────────────────────────────────────────────────────
#   GHCR_TOKEN         GitHub PAT (write:packages + repo) for pushing/pulling images
#   DEV_SSH_HOST        151.185.45.77
#   DEV_SSH_USER        Dev VM SSH username
#   DEV_SSH_PASSWORD    Dev VM SSH password
#   DEV_PG_PASSWORD     Same Postgres password set in infra-dev.yml
#   DEV_JWT_KEY         >= 32 chars; signs/validates JWTs (distinct from the
#                       dev-only placeholder in appsettings.Development.json)
#
#   OPTIONAL repo VARIABLES (Settings → Variables) — only needed if you want to
#   override a default:
#     DEV_API_PORT     default 5010
#     DEV_PG_PORT      default 5433  (must match infra-dev.yml)
#     DEV_CORS_ORIGIN  default https://nexmarket.nexeagle.com,http://151.185.45.77:3010,http://localhost:3000,http://localhost:3001
#                      (comma-separated; the deployed UI's real origins plus
#                      local dev server origins, for hitting this Dev API
#                      from `npm run dev` on your own machine)
#     DEV_JWT_ISSUER   default nexmarket-api
#     DEV_JWT_AUDIENCE default nexmarket-app
# ═══════════════════════════════════════════════════════════════════════════════

name: NexMarket API — CI/CD

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: nexmarket-api-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nexmarket-api

jobs:
  build:
    name: 'Stage 1 — Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-nexmarket-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-nexmarket-${{ runner.os }}-

      - name: Restore & Build
        working-directory: backend
        run: |
          dotnet restore SeemanchalOutreach.slnx
          dotnet build SeemanchalOutreach.slnx --configuration Release --no-restore

  docker:
    name: 'Stage 2 — Docker Build & Push'
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/SeemanchalOutreach.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: 'Stage 3 — Deploy → Dev'
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Deploy to Dev VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
          API_PORT: ${{ vars.DEV_API_PORT || '5010' }}
          PG_PORT: ${{ vars.DEV_PG_PORT || '5433' }}
          PG_PASSWORD: ${{ secrets.DEV_PG_PASSWORD }}
          JWT_KEY: ${{ secrets.DEV_JWT_KEY }}
          JWT_ISSUER: ${{ vars.DEV_JWT_ISSUER || 'nexmarket-api' }}
          JWT_AUDIENCE: ${{ vars.DEV_JWT_AUDIENCE || 'nexmarket-app' }}
          CORS_ORIGIN: ${{ vars.DEV_CORS_ORIGIN || 'https://nexmarket.nexeagle.com,http://151.185.45.77:3010,http://localhost:3000,http://localhost:3001' }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: IMAGE,GHCR_TOKEN,ACTOR,API_PORT,PG_PORT,PG_PASSWORD,JWT_KEY,JWT_ISSUER,JWT_AUDIENCE,CORS_ORIGIN
          script: |
            set -e
            : "${PG_PASSWORD:?DEV_PG_PASSWORD is empty}"
            : "${JWT_KEY:?DEV_JWT_KEY is empty}"

            mkdir -p /opt/nexmarket-api
            ENVFILE=/opt/nexmarket-api/dev.env
            {
              printf 'ASPNETCORE_ENVIRONMENT=%s\n' 'Development'
              printf 'ASPNETCORE_URLS=http://+:%s\n' "$API_PORT"
              printf 'ConnectionStrings__DefaultConnection=%s\n' "Host=localhost;Port=${PG_PORT};Database=nexmarket;Username=postgres;Password=${PG_PASSWORD}"
              printf 'Jwt__Key=%s\n' "$JWT_KEY"
              printf 'Jwt__Issuer=%s\n' "$JWT_ISSUER"
              printf 'Jwt__Audience=%s\n' "$JWT_AUDIENCE"
              printf 'Jwt__ExpiryHours=%s\n' '12'
              printf 'Cors__AllowedOrigins=%s\n' "$CORS_ORIGIN"
            } > "$ENVFILE"

            IMAGE_LC=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            # docker pull occasionally hits a transient containerd content-store race —
            # retry a couple of times before giving up, rather than failing the deploy.
            PULLED=0
            for i in 1 2 3; do
              if docker pull "$IMAGE_LC"; then PULLED=1; break; fi
              echo "docker pull attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PULLED" != 1 ]; then
              echo "docker pull failed after 3 attempts — aborting without touching the running container" >&2
              exit 1
            fi

            docker rm -f nexmarket-api-dev 2>/dev/null || true
            docker run -d --name nexmarket-api-dev --restart unless-stopped \
              --network host --env-file "$ENVFILE" "$IMAGE_LC"
            docker image prune -f || true

      - name: Health check
        run: |
          sleep 10
          PORT="${{ vars.DEV_API_PORT || '5010' }}"
          for i in 1 2 3 4 5; do
            S=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 \
                http://${{ secrets.DEV_SSH_HOST }}:${PORT}/health 2>/dev/null || echo 000)
            echo "Attempt $i — HTTP $S"
            [ "$S" = "200" ] && echo "✅ NexMarket API is up" && exit 0
            sleep 10
          done
          echo "⚠️ Health check inconclusive — check: docker logs nexmarket-api-dev"
          exit 0

      - name: Diagnose on the VM (container state + local curl, bypasses any external firewall)
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_PORT: ${{ vars.DEV_API_PORT || '5010' }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          port: 22
          envs: API_PORT
          script: |
            echo "── docker ps -a ──"
            docker ps -a --filter "name=nexmarket-api-dev"
            echo "── last 80 log lines ──"
            docker logs --tail 80 nexmarket-api-dev 2>&1 || true
            echo "── curl from inside the VM ──"
            curl -s -o /dev/null -w 'localhost:%{http_code}\n' --connect-timeout 3 --max-time 8 "http://localhost:${API_PORT}/health" || true
