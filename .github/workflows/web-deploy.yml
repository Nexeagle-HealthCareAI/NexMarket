# ═══════════════════════════════════════════════════════════════════════════════
# NEXMARKET WEB (Next.js) — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
# STAGES:
#   Stage 1 — Build      npm ci + lint + typecheck + next build
#   Stage 2 — Docker     build & push image to GHCR
#   Stage 3 — Deploy Dev pull image → run on Dev VM (develop branch, port 3010)
#
# NEXT_PUBLIC_* vars are inlined into the client bundle at BUILD time, not
# runtime — DEV_API_PUBLIC_URL below must be the browser-reachable API origin,
# and changing it requires a rebuild, not just a container restart.
#
# ─────────────────────────────────────────────────────────────────────────────
# SECRETS (repo Settings → Secrets and variables → Actions)
# ─────────────────────────────────────────────────────────────────────────────
#   GHCR_TOKEN         GitHub PAT (write:packages + repo) for pushing/pulling images
#   DEV_SSH_HOST        151.185.45.77
#   DEV_SSH_USER        Dev VM SSH username
#   DEV_SSH_PASSWORD    Dev VM SSH password
#
#   OPTIONAL repo VARIABLES (Settings → Variables):
#     DEV_WEB_PORT        default 3010
#     DEV_API_PUBLIC_URL  default http://151.185.45.77:5010  (must match
#                         DEV_API_PORT in api-deploy.yml — browser-reachable,
#                         not the container's internal address)
# ═══════════════════════════════════════════════════════════════════════════════

name: NexMarket Web — CI/CD

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'backend/**'
      - '.github/workflows/api-deploy.yml'
      - '.github/workflows/infra-dev.yml'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: nexmarket-web-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nexmarket-web

jobs:
  build:
    name: 'Stage 1 — Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      # Non-blocking: there are pre-existing lint errors in the repo today
      # (react-hooks/set-state-in-effect etc. in useGeolocation.ts) unrelated
      # to deploy infra. Reported, not gated, until those are cleaned up —
      # remove `continue-on-error` once they are.
      - run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - name: next build (typecheck only — real build happens in the Docker stage with the real API URL)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5010

  docker:
    name: 'Stage 2 — Docker Build & Push'
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.DEV_API_PUBLIC_URL || 'http://151.185.45.77:5010' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: 'Stage 3 — Deploy → Dev'
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Deploy to Dev VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
          WEB_PORT: ${{ vars.DEV_WEB_PORT || '3010' }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: IMAGE,GHCR_TOKEN,ACTOR,WEB_PORT
          script: |
            set -e
            IMAGE_LC=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            PULLED=0
            for i in 1 2 3; do
              if docker pull "$IMAGE_LC"; then PULLED=1; break; fi
              echo "docker pull attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PULLED" != 1 ]; then
              echo "docker pull failed after 3 attempts — aborting without touching the running container" >&2
              exit 1
            fi

            docker rm -f nexmarket-web-dev 2>/dev/null || true
            # HOSTNAME must be forced to 0.0.0.0: Next.js's standalone server.js binds
            # to `process.env.HOSTNAME || '0.0.0.0'`, and under --network host the
            # container inherits the VM's real hostname — which Next then binds to
            # exclusively, refusing connections on both localhost and the public IP.
            docker run -d --name nexmarket-web-dev --restart unless-stopped \
              --network host -e PORT="$WEB_PORT" -e HOSTNAME="0.0.0.0" "$IMAGE_LC"
            docker image prune -f || true

      - name: Health check
        run: |
          sleep 10
          PORT="${{ vars.DEV_WEB_PORT || '3010' }}"
          for i in 1 2 3 4 5; do
            S=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 8 \
                http://${{ secrets.DEV_SSH_HOST }}:${PORT}/api/health 2>/dev/null || echo 000)
            echo "Attempt $i — HTTP $S"
            [ "$S" = "200" ] && echo "✅ NexMarket Web is up" && exit 0
            sleep 10
          done
          echo "⚠️ Health check inconclusive — check: docker logs nexmarket-web-dev"
          exit 0

      - name: Diagnose on the VM (container state + local curl, bypasses any external firewall)
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        env:
          WEB_PORT: ${{ vars.DEV_WEB_PORT || '3010' }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          port: 22
          envs: WEB_PORT
          script: |
            echo "── docker ps -a ──"
            docker ps -a --filter "name=nexmarket-web-dev"
            echo "── restart count / exit code / OOM ──"
            docker inspect nexmarket-web-dev --format 'RestartCount={{.RestartCount}} Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} StartedAt={{.State.StartedAt}} FinishedAt={{.State.FinishedAt}}'
            echo "── all log lines (no truncation) ──"
            docker logs nexmarket-web-dev 2>&1 || true
            echo "── retry curl from inside the VM (a few times, container may still be cycling) ──"
            for i in 1 2 3; do
              curl -s -o /dev/null -w "attempt $i localhost:%{http_code}\n" --connect-timeout 3 --max-time 8 "http://localhost:${WEB_PORT}/api/health" || true
              sleep 3
            done
