# Throwaway: prints the Dev API container's recent errors. Lives only on branch ops/api-logs; push to it to run.
name: Ops — Dev API logs
on:
  push:
    branches: [ops/api-logs]
jobs:
  logs:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            echo "=== livekit container"
            docker ps --filter name=nexmarket-livekit --format '{{.Names}} {{.Status}}'
            echo "=== livekit logs (last 2h, filtered)"
            docker logs --since 2h nexmarket-livekit 2>&1 | grep -v -i "secret\|token" | grep -i -E "external|ip|starting|room|participant|ice|turn|error|warn|fail|udp|tcp" | tail -80
            echo "=== listening sockets for LiveKit"
            (ss -tulnp 2>/dev/null || netstat -tulnp) | grep -E ":(7880|7881|3478|5349|5000[0-9]|500[1-9][0-9]|50100) " | head -20
            echo "=== whoami / sudo"
            id; sudo -n true 2>/dev/null && echo "sudo: yes" || echo "sudo: no"
            echo "=== ufw"
            sudo -n ufw status verbose 2>&1 | head -30
            echo "=== iptables INPUT"
            sudo -n iptables -S INPUT 2>&1 | head -40
            echo "=== public IP seen by VM"
            curl -s -m 5 https://api.ipify.org; echo
            echo "=== cloud metadata (who hosts this VM)"
            curl -s -m 3 -H "Authorization: Bearer Oracle" http://169.254.169.254/opc/v2/instance/ 2>/dev/null | head -c 300; echo
            curl -s -m 3 -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>/dev/null | head -c 300; echo
