# Shares port 443 between the websites and the calls relay (TURN over TLS), by the name the phone asks for (SNI):
#   turn.nexeagle.com  → LiveKit's TURN on 127.0.0.1:5349 (LiveKit has the certificate; nginx doesn't decrypt it)
#   everything else    → the existing HTTPS sites, now on 127.0.0.1:8443
#
# Install: sudo apt install libnginx-mod-stream, then put this file at /etc/nginx/streams-enabled/nexeagle-443.conf
# and add ONE line at the top level of /etc/nginx/nginx.conf (outside "http { }"):
#     stream { include /etc/nginx/streams-enabled/*.conf; }
# Then in every existing "listen 443 ssl" site (API, CRM, calls…) change the listen lines to:
#     listen 127.0.0.1:8443 ssl proxy_protocol;      # was: listen 443 ssl;  (remove any "listen [::]:443 ssl")
#     set_real_ip_from 127.0.0.1;
#     real_ip_header proxy_protocol;                 # so the sites still see the visitor's real IP
# Check and reload: sudo nginx -t && sudo systemctl reload nginx
#
# Tested: with UDP blocked, two browsers connected through turns:turn.nexeagle.com:443 via this routing, while HTTPS on
# the same port still reached the website with the visitor's address.

map $ssl_preread_server_name $nexeagle_443 {
    turn.nexeagle.com  127.0.0.1:5350;
    default            127.0.0.1:8443;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_protocol on;            # passes the visitor's IP on to the websites
    proxy_pass $nexeagle_443;
}

# TURN doesn't understand the proxy-protocol header: this hop removes it before LiveKit.
server {
    listen 127.0.0.1:5350 proxy_protocol;
    proxy_pass 127.0.0.1:5349;
}
