# The calls server. Runs next to the API on the same VM. The deploy job writes livekit.active.yaml (livekit.yaml, with
# the TURN-over-443 lines only once the certificate exists) and .env, then:
#   docker compose -f docker-compose.livekit.yml up -d
# Host networking because WebRTC needs a whole range of UDP ports.
services:
  livekit:
    image: livekit/livekit-server:v1.13.3
    container_name: nexmarket-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?set LIVEKIT_KEYS (key and secret, see README)}
    volumes:
      - ./livekit.active.yaml:/etc/livekit.yaml:ro
      # The Let's Encrypt certificate for turn.nexeagle.com (TURN over TLS on 443); read-only.
      - /etc/letsencrypt:/etc/letsencrypt:ro
